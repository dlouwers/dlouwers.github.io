name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Publish window for future-dated posts. Frontmatter dates coerce to
    # 00:00 UTC (js-yaml parses a bare YYYY-MM-DD as a UTC Date before Zod
    # sees it), so a post dated 2026-08-18 goes live on that day's 04:37 UTC
    # run — 06:37 CEST. See src/lib/posts.ts for the gate itself.
    #
    # Twice daily: GitHub drops scheduled runs under load and never retries
    # them, so the afternoon run self-heals a missed morning. Off-the-hour
    # minutes because schedules at :00 are the most contended.
    #
    # HAZARD: GitHub disables `schedule:` triggers in a repository that sees
    # no activity for 60 days, and a queue of posts merged in one batch is
    # exactly that kind of quiet. Keep a publishing queue shorter than ~50
    # days from its merge, or merge it in two batches. GitHub emails the
    # repository owner before disabling, so this fails loudly rather than
    # silently — but it does fail.
    - cron: '37 4 * * *'
    - cron: '37 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The design system's npm packages live in Google Artifact Registry.
      # No secret: this job proves who it is through GitHub OIDC (the
      # id-token permission above) → Workload Identity Federation, provider
      # dlouwers-github-io in the github-npm-packages pool, which may only
      # read (scripts/gcp-npm-packages.nu in dlouwers/experiments).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/356863323226/locations/global/workloadIdentityPools/github-npm-packages/providers/dlouwers-github-io

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Registry token
        id: gar
        run: |
          token=$(gcloud auth print-access-token)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          # The committed .npmrc interpolates ${NPM_GAR_TOKEN}: a one-hour
          # access token from the step above.
          NPM_GAR_TOKEN: ${{ steps.gar.outputs.token }}
        run: bun install --frozen-lockfile

      - name: Build
        # `bun run build` hangs in CI when remark plugins use
        # worker_threads (our remark-d2 plugin loads @terrastruct/d2's
        # WASM worker). Upstream: withastro/astro#8483 (closed
        # not-planned) and oven-sh/bun#8816. Run the build via Node so
        # the worker terminates and the process exits.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
